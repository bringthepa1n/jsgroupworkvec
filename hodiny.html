<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super hodiny</title>
    <script src="hodiny.js" defer></script>
    <link rel="stylesheet" href="hodiny.css">
</head>
<body>
    <main>
  <div id="clock">00:00:00</div>
  <div id="date"></div>
</main>

<button id="settingsBtn" aria-expanded="false">⚙ Nastavení</button>

<section id="settingsPanel" class="panel">
  <label for="offsetInput">Posun (v minutách)</label>
  <input type="number" id="offsetInput" step="1" value="0">
  <button id="saveBtn">Uložit</button>
</section>

<div id="toast" class="toast"></div>
</body>
</html>
